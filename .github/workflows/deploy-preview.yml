name: Deploy Preview (Supabase branch)

on:
  push:
    branches: [claude/supabase-cloud-migration-vCHBP]
  workflow_dispatch:

env:
  PAGES_REPO: ginn5j/ginn5j.github.io
  PAGES_DIR: album-club-next
  VITE_BASE_URL: /album-club-next

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: ${{ env.VITE_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Checkout pages repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PAGES_REPO }}
          token: ${{ secrets.PAGES_PAT }}
          path: pages-repo

      - name: Copy built files
        run: |
          rm -rf pages-repo/${{ env.PAGES_DIR }}
          cp -r dist pages-repo/${{ env.PAGES_DIR }}

      - name: Commit and push
        run: |
          cd pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.PAGES_DIR }}
          git diff --cached --quiet && echo "No changes" || git commit -m "Deploy album-club-next preview"
          git push
