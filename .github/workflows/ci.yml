name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # TEMPORARY: regenerate the drifted lockfile and expose it as an
      # artifact so it can be committed (Node is not installed locally).
      # Will be reverted to `npm ci` once the lockfile is committed.
      - run: npm install

      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
